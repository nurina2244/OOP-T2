<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topic 2</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #e0e0e0; padding: 20px; display: flex; justify-content: center; }
    .quiz-container { width: 100%; max-width: 650px; background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .progress-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-weight: bold; }
    .badge { padding: 6px 12px; border-radius: 20px; font-size: 14px; }
    .badge-correct { background-color: #2e7d32; color: white; }
    .badge-wrong { background-color: #c62828; color: white; }
    .question { font-size: 18px; margin-bottom: 20px; font-weight: 600; line-height: 1.4; }
    .option { background: #2c2c2c; padding: 14px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; border: 1px solid #3d3d3d; }
    .option:hover { background: #3a3a3a; }
    .option.correct { background: #1b5e20 !important; border-color: #4caf50; color: white; }
    .option.wrong { background: #b71c1c !important; border-color: #f44336; color: white; }
    .nav-btns { display: flex; justify-content: space-between; margin-top: 20px; }
    button { background: #1a73e8; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:disabled { background: #424242; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="quiz-container">
    <h2><center>Topic 2</center></h2>
    
    <div class="progress-bar">
      <span id="question-number">Question 1 / 50</span>
      <div>
        <span class="badge badge-correct" id="correct-count">Correct: 0</span>
        <span class="badge badge-wrong" id="wrong-count">Wrong: 0</span>
      </div>
    </div>

    <div id="question-text" class="question">Loading question...</div>
    
    <div id="options-container"></div>

    <div class="nav-btns">
      <button id="prev-btn" onclick="prevQuestion()" disabled>Previous</button>
      <button id="next-btn" onclick="nextQuestion()">Next</button>
    </div>
</div>

<script>
  const quizData = [
    // --- 2.1 Class and Object Structures ---
    {
      q: "What is the basic definition of a 'Class' in object-oriented programming?",
      options: ["A special variable for numbers", "A blueprint or template used to create objects", "A function that returns an absolute value", "A process for reading text files"],
      answer: 1
    },
    {
      q: "Which keyword is used to declare a class in Java?",
      options: ["object", "define", "class", "struct"],
      answer: 2
    },
    {
      q: "What are the two main components of a class?",
      options: ["Attributes and Methods", "Variables and Loops", "Imports and Packages", "Inputs and Outputs"],
      answer: 0
    },
    {
      q: "A variable declared inside the body of a method is called a...",
      options: ["Instance variable", "Static variable", "Local variable", "Global variable"],
      answer: 2
    },
    {
      q: "Where is an Instance Variable declared?",
      options: ["Inside a method only", "Outside the class entirely", "Inside the class but outside any method", "Inside the main function"],
      answer: 2
    },
    {
      q: "Which operator is used to allocate memory and create a new object?",
      options: ["create", "new", "make", "instance"],
      answer: 1
    },
    {
      q: "Which UML symbol represents 'public' access?",
      options: ["-", "+", "#", "~"],
      answer: 1
    },
    {
      q: "Which UML symbol represents 'private' access?",
      options: ["-", "+", "#", "~"],
      answer: 0
    },
    {
      q: "Which UML symbol represents 'protected' access?",
      options: ["-", "+", "#", "~"],
      answer: 2
    },
    {
      q: "What is the correct order of compartments in a UML Class Diagram from top to bottom?",
      options: ["Methods, Class Name, Attributes", "Class Name, Attributes, Methods", "Attributes, Class Name, Methods", "Class Name, Methods, Attributes"],
      answer: 1
    },
    {
      q: "Which syntax is correct to create an object named 'myLaptop' of class 'Laptop'?",
      options: ["Laptop myLaptop = Laptop();", "Laptop myLaptop = new Laptop();", "new Laptop myLaptop = Laptop();", "myLaptop Laptop = new Laptop();"],
      answer: 1
    },
    {
      q: "How do you access an object's attributes or methods in Java?",
      options: ["Using a dot symbol (.)", "Using a comma symbol (,)", "Using an arrow symbol (->)", "Using a colon symbol (:)"],
      answer: 0
    },
    {
      q: "What is the default value of an uninitialized instance variable of type int?",
      options: ["null", "0", "1", "undefined"],
      answer: 1
    },
    {
      q: "What is the default value of an uninitialized reference variable (e.g., String)?",
      options: ["0", "empty", "null", "false"],
      answer: 2
    },

    // --- 2.2 Methods and Access Control ---
    {
      q: "Which access specifier allows a class member to be accessed from any other class?",
      options: ["private", "public", "protected", "default"],
      answer: 1
    },
    {
      q: "Which access specifier restricts access to class members strictly within its own class?",
      options: ["private", "public", "protected", "default"],
      answer: 0
    },
    {
      q: "If no access specifier is written before a variable, what access level is assigned by default?",
      options: ["private", "public", "protected", "default (package-private)"],
      answer: 3
    },
    {
      q: "What is the primary purpose of a Constructor in Java?",
      options: ["To delete objects from memory", "To initialize values for an object when it is created", "To execute program loops", "To read keyboard inputs"],
      answer: 1
    },
    {
      q: "What is the key naming requirement for a Constructor?",
      options: ["Must start with a lowercase letter", "Must match the class name exactly", "Must be named 'construct'", "Must use the keyword main"],
      answer: 1
    },
    {
      q: "What is the return type of a Constructor?",
      options: ["void", "int", "String", "No return type is specified"],
      answer: 3
    },
    {
      q: "Can a class have more than one Constructor?",
      options: ["Yes, through constructor overloading", "No, only one constructor is allowed", "Yes, but they must be in different files", "No, unless inheritance is used"],
      answer: 0
    },
    {
      q: "What does 'Method Overloading' mean?",
      options: ["A method calling itself recursively", "Multiple methods having the same name but different parameter lists", "A method modifying global variables", "A method ignoring return values"],
      answer: 1
    },
    {
      q: "How does Java distinguish between overloaded methods with the same name?",
      options: ["By return type only", "By the number, type, or order of parameters", "By variable names inside the method", "By access modifier only"],
      answer: 1
    },
    {
      q: "Which keyword is used to return a value from a method?",
      options: ["give", "send", "return", "exit"],
      answer: 2
    },
    {
      q: "What keyword is used as the return type if a method does not return any value?",
      options: ["null", "static", "void", "empty"],
      answer: 2
    },
    {
      q: "What is meant by the concept of 'Encapsulation'?",
      options: ["Bundling data and methods into a single unit while hiding sensitive data", "Testing code using repeated loops", "Converting data types from integer to double", "Making a backup copy of project files"],
      answer: 0
    },
    {
      q: "How is encapsulation commonly implemented in Java?",
      options: ["Making attributes public and methods private", "Making attributes private and providing public Getter/Setter methods", "Making all components public", "Making all components default"],
      answer: 1
    },
    {
      q: "What is the purpose of a 'Getter' (accessor) method?",
      options: ["To set a new value to an attribute", "To read or retrieve the value of a private attribute", "To delete an attribute from a class", "To instantiate a new object"],
      answer: 1
    },
    {
      q: "What is the purpose of a 'Setter' (mutator) method?",
      options: ["To set or update the value of a private attribute", "To read an attribute's value", "To return the attribute's size", "To print values to the screen"],
      answer: 0
    },
    {
      q: "The keyword 'this' in Java refers to...",
      options: ["The parent class", "The current object instance of the class", "The main method", "An external system file"],
      answer: 1
    },
    {
      q: "Which statement is TRUE regarding 'Pass-by-Value' parameter passing in Java?",
      options: ["The original value can be directly modified by the called method", "Only a copy of the value is passed into the method", "The original memory reference is passed directly", "It only applies to objects"],
      answer: 1
    },

    // --- 2.3 Input and Output Stream Operations & Type Casting ---
    {
      q: "Which class from the `java.util` package is commonly used to read user input?",
      options: ["BufferedReader", "Scanner", "InputStream", "ConsoleReader"],
      answer: 1
    },
    {
      q: "Which `import` statement is correct to use the Scanner class?",
      options: ["import java.io.Scanner;", "import java.util.Scanner;", "import java.scanner.Util;", "include java.util.Scanner;"],
      answer: 1
    },
    {
      q: "Which Scanner method is used to read an integer number?",
      options: ["nextDouble()", "nextLine()", "nextInt()", "readInt()"],
      answer: 2
    },
    {
      q: "Which Scanner method is used to read an entire line of text (String)?",
      options: ["next()", "nextLine()", "readString()", "nextText()"],
      answer: 1
    },
    {
      q: "What is the main difference between `System.out.print()` and `System.out.println()`?",
      options: ["println() adds a new line at the end of output, print() does not", "print() is faster than println()", "print() is only for numbers, println() for text", "There is no difference"],
      answer: 0
    },
    {
      q: "What is meant by 'Type Casting' in Java?",
      options: ["Printing data to the screen", "Converting one primitive data type to another", "Declaring a new variable", "Installing Java software"],
      answer: 1
    },
    {
      q: "What are the two main types of Type Casting in Java?",
      options: ["Implicit Casting and Explicit Casting", "Internal Casting and External Casting", "Public Casting and Private Casting", "Automatic Casting and Manual Casting"],
      answer: 0
    },
    {
      q: "Implicit casting (widening conversion) occurs when converting from...",
      options: ["A larger data size to a smaller data size", "A smaller data size to a larger data size", "String to int", "Object to primitive"],
      answer: 1
    },
    {
      q: "Which of the following conversions is performed automatically via Implicit Casting?",
      options: ["double to int", "long to short", "int to double", "float to int"],
      answer: 2
    },
    {
      q: "Explicit casting (narrowing conversion) is required when converting from...",
      options: ["A smaller data size to a larger data size", "A larger data size to a smaller data size", "int to long", "byte to int"],
      answer: 1
    },
    {
      q: "Which syntax shows correct Explicit Casting from `double` to `int`?",
      options: ["int x = (int) 9.78;", "int x = 9.78(int);", "int x = castToInt(9.78);", "int x = double 9.78;"],
      answer: 0
    },
    {
      q: "What is the value of `x` after running: `double d = 9.99; int x = (int) d;`?",
      options: ["10", "9.99", "9", "0"],
      answer: 2
    },
    {
      q: "Which standard Java object represents the Standard Output Stream?",
      options: ["System.in", "System.out", "System.err", "System.exit"],
      answer: 1
    },
    {
      q: "Which standard Java object represents the Standard Input Stream?",
      options: ["System.in", "System.out", "System.err", "System.read"],
      answer: 0
    },
    {
      q: "Which syntax is correct to create a Scanner object named `sc`?",
      options: ["Scanner sc = Scanner(System.in);", "Scanner sc = new Scanner(System.in);", "Scanner sc = new Scanner();", "new Scanner sc(System.in);"],
      answer: 1
    },
    {
      q: "Which Scanner method is used to read a decimal number of type `double`?",
      options: ["nextFloat()", "readDouble()", "nextDouble()", "nextNum()"],
      answer: 2
    },
    {
      q: "Which hierarchy of primitive data type sizes from smallest to largest is correct?",
      options: ["byte -> short -> int -> long -> float -> double", "double -> float -> long -> int -> short -> byte", "int -> byte -> short -> double -> float", "short -> byte -> int -> long -> double"],
      answer: 0
    },
    {
      q: "Can data loss (truncation) occur during Explicit Casting from `double` to `int`?",
      options: ["Yes, the decimal portion is truncated", "No, the value is automatically rounded", "No, Java maintains decimal precision", "A compilation error will occur"],
      answer: 0
    },
    {
      q: "What is the output of `System.out.println(\"Result: \" + 5 + 5);` in Java?",
      options: ["Result: 10", "Result: 55", "Result: 5", "Compiler error"],
      answer: 1
    }
  ];

  let currentQuestion = 0;
  let userAnswers = new Array(quizData.length).fill(null);
  let correctScore = 0;
  let wrongScore = 0;

  function loadQuestion() {
    const qData = quizData[currentQuestion];
    document.getElementById('question-number').innerText = `Question ${currentQuestion + 1} / ${quizData.length}`;
    document.getElementById('question-text').innerText = qData.q;
    
    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';

    qData.options.forEach((opt, index) => {
      const optionDiv = document.createElement('div');
      optionDiv.className = 'option';
      optionDiv.innerText = opt;

      if (userAnswers[currentQuestion] !== null) {
        if (index === qData.answer) {
          optionDiv.classList.add('correct');
        }
        if (userAnswers[currentQuestion] === index && index !== qData.answer) {
          optionDiv.classList.add('wrong');
        }
      } else {
        optionDiv.onclick = () => selectOption(index);
      }

      optionsContainer.appendChild(optionDiv);
    });

    document.getElementById('prev-btn').disabled = currentQuestion === 0;
    document.getElementById('next-btn').disabled = currentQuestion === quizData.length - 1;
  }

  function selectOption(index) {
    if (userAnswers[currentQuestion] !== null) return;

    userAnswers[currentQuestion] = index;
    if (index === quizData[currentQuestion].answer) {
      correctScore++;
    } else {
      wrongScore++;
    }

    updateScoreBadge();
    loadQuestion();
  }

  function updateScoreBadge() {
    document.getElementById('correct-count').innerText = `Correct: ${correctScore}`;
    document.getElementById('wrong-count').innerText = `Wrong: ${wrongScore}`;
  }

  function nextQuestion() {
    if (currentQuestion < quizData.length - 1) {
      currentQuestion++;
      loadQuestion();
    }
  }

  function prevQuestion() {
    if (currentQuestion > 0) {
      currentQuestion--;
      loadQuestion();
    }
  }

  loadQuestion();
</script>

</body>
</html>
